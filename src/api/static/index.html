<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- Base URL of the API. Empty = same origin. Point this at another host to use a remote backend. -->
  <meta name="api-base" content="">
  <title>Groundtruth</title>
  <meta name="description" content="Ask a question over a legal corpus and see retrieval and generation side by side; inspect retrieval evaluation results.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e5b4b'/%3E%3Crect x='8' y='21' width='16' height='3' rx='1.5' fill='%23fbfaf5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app" id="app">
    <header class="topbar">
      <button class="btn btn--ghost btn--icon" id="menu-open" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
      <a class="brand" href="#/ask"><span class="brand__mark" aria-hidden="true"></span>Groundtruth</a>
      <span class="topbar__title muted" id="topbar-title"></span>
    </header>

    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="sidebar__brand">
        <a class="brand" href="#/ask"><span class="brand__mark" aria-hidden="true"></span>Groundtruth</a>
        <button class="btn btn--ghost btn--icon btn--sm sidebar__close" id="menu-close" type="button" aria-label="Close menu"></button>
      </div>

      <nav class="nav" aria-label="Main">
        <a href="#/ask" data-route="ask">Ask</a>
        <a href="#/evaluation" data-route="evaluation">Evaluation</a>
      </nav>

      <section class="history" aria-labelledby="history-label">
        <div class="history__head">
          <h2 class="history__label" id="history-label">History</h2>
          <button class="btn btn--ghost btn--sm" id="history-clear" type="button" hidden>Clear</button>
        </div>
        <ul class="history__list" id="history-list"></ul>
      </section>

      <div class="sidebar__foot">
        <span class="status-dot" id="status-dot" data-state="unknown" aria-hidden="true"></span>
        <span id="status-text">Checking API…</span>
      </div>
    </aside>

    <main id="view" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">Groundtruth needs JavaScript to run.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
