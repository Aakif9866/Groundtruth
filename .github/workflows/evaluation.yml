name: Retrieval Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,api]"

      - name: Unit tests
        run: pytest -m unit -q

      - name: Integration tests (runner, datasets, API)
        run: pytest -m integration -q

      - name: Evaluation tests and the regression gate
        # EVAL_CONFIG defaults to "baseline" and this must stay green on main.
        # To see the gate fail on purpose, run locally with EVAL_CONFIG=broken.
        run: pytest -m evaluation -q

      - name: Run retrieval evaluation and produce the comparison report
        run: python -m src.evaluation.evaluate

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            reports/comparison.md
            reports/comparison.csv
            reports/dashboard.html
