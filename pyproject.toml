[project]
name = "groundtruth"
version = "0.1.0"
description = "Retrieval evaluation and regression harness for RAG systems, demonstrated on a synthetic legal-research corpus."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.6",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
ragas = ["ragas>=0.1", "langchain-anthropic>=0.1"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises real retrieval (model load + inference), not just pure functions",
]
