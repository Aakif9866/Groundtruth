[project]
name = "groundtruth"
version = "0.1.0"
description = "Retrieval evaluation and regression harness for RAG systems, demonstrated on a synthetic legal-research corpus."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.6",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure functions, no model downloads",
    "integration: runner, dataset and API plumbing (loads the small embedding model)",
    "evaluation: full retrieval over the golden sets, including the CI regression gate",
    "smoke: browser smoke tests of the web UI (needs playwright and Chrome; not run in CI)",
    "slow: exercises real retrieval (model load + inference), not just pure functions",
]
